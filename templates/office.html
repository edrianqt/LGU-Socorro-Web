{% extends "base.html" %}
{% block content %}
<section class="page-hero compact">
  <h1>{{ office.name }}</h1>
  <p>{{ office.description }}</p>
</section>
<section class="content-section">
  <div class="org-chart">
    {% for person in office.staff %}
      <article>
        <span>{{ loop.index }}</span>
        <h3>{{ person.name }}</h3>
        <p>{{ person.role }}</p>
        {% if person.reports_to %}<small>Reports to {{ person.reports_to }}</small>{% endif %}
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
